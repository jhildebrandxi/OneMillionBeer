<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · One Million Beer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#FAC775;--amber-dark:#412402;
  --bg:#fff;--bg-2:#f7f5f0;--bg-3:#eceae3;
  --text:#1a1917;--text-2:#6b6960;--text-3:#9c9a92;
  --border:rgba(0,0,0,0.09);--border-2:rgba(0,0,0,0.15);
  --red-bg:#FCEBEB;--red-tx:#791F1F;--grn-bg:#EAF3DE;--grn-tx:#27500A;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1b1a17;--bg-2:#232219;--bg-3:#2c2b25;
  --text:#f0ede5;--text-2:#9d9a91;--text-3:#6a6860;
  --border:rgba(255,255,255,0.08);--border-2:rgba(255,255,255,0.15);
  --red-bg:#3a1515;--red-tx:#f5a0a0;--grn-bg:#192e10;--grn-tx:#9fd070
}}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--bg-2);border-radius:16px;padding:2rem;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.logo{font-size:32px;margin-bottom:1rem}
h1{font-size:18px;font-weight:700;margin-bottom:.25rem}
.sub{font-size:13px;color:var(--text-2);margin-bottom:1.5rem;line-height:1.5}
label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
input[type=password],input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border-2);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;margin-bottom:1rem}
input:focus{border-color:var(--amber)}
.drop-zone{border:2px dashed var(--border-2);border-radius:10px;padding:2rem 1.5rem;text-align:center;cursor:pointer;transition:.15s;background:var(--bg);margin-bottom:1rem}
.drop-zone:hover,.drop-zone.drag{background:var(--bg-3);border-color:var(--amber)}
.drop-icon{font-size:28px;margin-bottom:.5rem}
.drop-title{font-size:14px;font-weight:500;margin-bottom:4px}
.drop-hint{font-size:12px;color:var(--text-2)}
#file-input{display:none}
.btn{width:100%;background:var(--amber);border:none;border-radius:8px;padding:11px;font-size:15px;font-weight:600;color:var(--amber-dark);cursor:pointer;font-family:var(--font);transition:.1s}
.btn:hover{background:#f5b84e}.btn:disabled{opacity:.4;cursor:not-allowed}
.progress{height:4px;background:var(--bg-3);border-radius:4px;margin-top:1rem;overflow:hidden;display:none}
.progress-bar{height:100%;background:var(--amber);width:0;transition:width .3s}
.msg{border-radius:8px;padding:.75rem 1rem;font-size:13px;margin-top:1rem;line-height:1.5;display:none}
.msg.ok{background:var(--grn-bg);color:var(--grn-tx);display:block}
.msg.err{background:var(--red-bg);color:var(--red-tx);display:block}
.step{font-size:12px;color:var(--text-3);margin-top:.75rem;text-align:center;min-height:18px}
.back{display:block;text-align:center;margin-top:1.25rem;font-size:12px;color:var(--text-3);text-decoration:none}
.back:hover{color:var(--text-2)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🍺</div>
  <h1>One Million Beer · Admin <span style="font-size:11px;font-weight:400;color:var(--text-3);margin-left:6px">build 2026-11-03 · profiles + world · i.A.-Regel 22.10.</span></h1>
  <p class="sub">Upload a new WhatsApp export to update the leaderboard and history for everyone.</p>

  <div id="login-section">
    <label for="pw">GitHub Token</label>
    <input type="password" id="pw" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
    <label for="repo">Repository</label>
    <input type="text" id="repo" value="jhildebrandxi/OneMillionBeer">
    <button class="btn" onclick="doLogin()">Connect</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div id="upload-section" style="display:none">
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="drop-icon">📂</div>
      <p class="drop-title">Drop WhatsApp export here or click</p>
      <p class="drop-hint">.txt file · with or without media</p>
    </div>
    <input type="file" id="file-input" accept=".txt">
    <button class="btn" id="upload-btn" onclick="doUpload()" disabled>Process & upload</button>
    <div class="progress" id="progress"><div class="progress-bar" id="pbar"></div></div>
    <p class="step" id="step-text"></p>
    <div class="msg" id="upload-msg"></div>
    <div id="recap-box" style="display:none;margin-top:1rem">
      <label>Weekly recap message — copy into the group</label>
      <textarea id="recap-text" readonly style="width:100%;min-height:170px;background:var(--bg);border:1px solid var(--border-2);border-radius:8px;padding:10px 12px;font-size:13px;font-family:var(--font);color:var(--text);resize:vertical"></textarea>
      <button class="btn" style="margin-top:8px" onclick="copyRecap()">📋 Copy message</button>
    </div>
  </div>

  <a href="index.html" class="back">← Back to dashboard</a>
</div>

<script>
// ================= CONFIG (edit here) =================
// Challenge days: everyone who posted at least one beer on that day gets a badge for it.
// Add a new line after every challenge. date = YYYY-MM-DD (German time).
const CHALLENGE_DAYS = [
  { date: '2026-09-25', label: 'Challenge 25.09.' },
  { date: '2026-10-24', label: 'Record Day 24.10.' }
];
// Members who don't want a public profile page: put their name exactly as in the export.
// They stay in the leaderboard, but their name is not clickable and no profile data is written.
const PROFILE_OPTOUT = [];
// World map: also count numbers that were only *requested* to be added ("hat angefragt, … hinzuzufügen").
// true = more complete (most members join this way); false = only confirmed adds/joins/leaves.
const WORLD_INCLUDE_INVITES = true;
// The founders' country is unlocked on the day the group was created (founders are saved contacts,
// so their numbers never appear in the export).
const HOME_COUNTRY = 'DE';
// ======================================================

// ---------- shared date/clean helpers ----------
const clean = s => s.replace(/^[\u200e\u200f\u202f\ufeff]+/,'').trim();
const MSG_RE = /^\[(\d{1,2}\.\d{1,2}\.\d{2,4}),\s*(\d{1,2}:\d{2}(?::\d{2})?)\]\s*(.+?):\s*(.*)/;
const NUM_RE = /^[~#\s]*(\d{1,2}\.?\d{3}(?:\.\d{3})?|\d{3,6})\D*$/u;
const JOIN_RE = /hat\s+(.+?)\s+hinzugef/i;
const SKIP = ['hat die Gruppe','hat die Gruppenbesch','Nachrichten und Anrufe','wurde bearbeitet',
  'hat angefragt','hat die Genehm','festgelegt','hat das Gruppen',
  'hat in den Einstellungen','aktiviert','Ende-zu-Ende'];

// ---------- chat counter (only for the "NEXT NUMBER TO POST" line) ----------
// What counts as a beer is decided by IMG_RE below (one photo = one beer). The chat
// counter is only read to tell the group which number comes next: a number counts as
// "real" if enough other posts nearby carry numbers close to it (typos like 37781 or
// 763837 have no neighbours and fall out) and the same person didn't send it twice.
const CNT_RE = /^[~#\s]*(?:i\.?\s?A\.?\s*)?(\d{1,2}\.\d{3}(?:\.\d{3})?|\d{1,6})(?!\d)(?:[^\d].*)?$/i;
// ---------- what counts as a beer ----------
// RULE: one photo = one beer. A message counts if it carries an image (WhatsApp writes
// "Bild weggelassen" when exporting without media), whatever the caption says: right number,
// wrong number, a forgotten number, "i.A. …", or the same number as someone else. Text-only
// messages (corrections, chat) and videos/stickers/voice notes never count.
// The counter validation above is now only used to find the CURRENT COUNTER (for the
// "next number to post" line of the recap), not to decide what counts.
// "i.A." = posted on behalf of a friend. Counts for the group/leaderboard score, but NOT for
// the individual Hall-of-Fame stats (streak, best week, most beers in 24h).
const IA_RE = /(?<![a-zäöüß])(?:i\s?\.?\s?[av](?![a-zäöüß])|a\s?\.?\s?i(?![a-zäöüß])|a\.\s?a\.|im\s+auftrag)|\u{1FACF}/iu;   // i.A. / I.a. / i. A. / I .A / iA / ia / i.v. / A.I / a.i. / A.a. (typos) / im Auftrag / donkey emoji; number before, after or glued to it
const looksIA = cont => IA_RE.test(cont.replace(/@?[\u200b\u2060]*\u2068[^\u2069]*\u2069/g,'@').slice(0,60));   // @mentions removed first so names like "Ivan" can't trigger
const IMG_RE = /(?:Bild|image|photo)\s+weggelassen|image omitted|<Anhang:[^>]*\.(?:jpe?g|png|heic|webp)/i;
function counterCandidates(lines) {
  const out=[];
  for (let li=0; li<lines.length; li++) {
    const m = MSG_RE.exec(clean(lines[li]));
    if (!m) continue;
    const snd=m[3].trim(), cont=clean(m[4]);
    if (cont.includes('erstellt') || cont.includes('hinzugefügt') || cont.includes('beigetreten')) continue;
    if (cont.includes('hat die Gruppe verlassen')) continue;
    if (cont.includes('entfernt') && (cont.includes('Du hast') || cont.includes(' hat '))) continue;
    if (SKIP.some(w=>cont.includes(w))) continue;
    const cm = CNT_RE.exec(cont);
    if (!cm) continue;
    const v = parseInt(cm[1].replace(/\./g,''),10);
    if (!(v>0)) continue;
    out.push({li, snd, v});
  }
  return out;
}
let _cidx = {text:null, val:null};
function getCounterIndex(text) {
  if (_cidx.text === text) return _cidx.val;
  const lines = text.split('\n'), c = counterCandidates(lines), n = c.length;
  const WI=30, WV=60, K=8;
  const valid=new Set(), seen=new Set(), acc=[];
  let far=0, dupes=0;
  for (let j=0; j<n; j++) {
    const v=c[j].v, sup=new Set();
    for (let k=Math.max(0,j-WI); k<Math.min(n,j+WI+1) && sup.size<K; k++) {
      const x=c[k].v;
      if (x!==v && Math.abs(x-v)<=WV) sup.add(x);
    }
    if (sup.size<K) { far++; continue; }
    const key=c[j].snd+'|'+v;
    if (seen.has(key)) { dupes++; continue; }
    seen.add(key); valid.add(c[j].li); acc.push(v);
  }
  // current counter: densest cluster among the last 15 valid posts, highest value in it
  const last=acc.slice(-15); let best=0, bestCnt=-1;
  for (let i=last.length-1; i>=0; i--) {
    const cnt=last.filter(x=>Math.abs(x-last[i])<=15).length;
    if (cnt>bestCnt) { bestCnt=cnt; best=last[i]; }
  }
  const counter = last.filter(x=>Math.abs(x-best)<=15).reduce((a,b)=>Math.max(a,b),0);
  _cidx = {text, val:{valid, counter, accepted:acc.length, far, dupes}};
  return _cidx.val;
}

function parseDate(ds) {
  const p = ds.split('.');
  try { const y=p[2].length===2?2000+ +p[2]: +p[2]; return new Date(y,+p[1]-1,+p[0]); }
  catch { return null; }
}
// Full timestamp incl. time-of-day — needed for rolling-24h calculations.
// Falls back to midnight if the time string can't be parsed (keeps callers safe).
function parseDateTime(ds, ts) {
  const d = parseDate(ds);
  if (!d) return null;
  const tp = (ts||'').split(':');
  const h = +tp[0]||0, mi = +tp[1]||0, se = +tp[2]||0;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, mi, se);
}
function fmt(d) {
  return d ? d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '?';
}
function dayKeyOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Longest-ever streak. Returns length plus the date range it occurred in —
// needed for the Hall-of-Fame display (a bare number has no context).
function calcStreak(dayArr) {
  if (!dayArr || dayArr.length === 0) return {length:0,startDate:null,endDate:null};
  const days = dayArr.map(d => new Date(d)).sort((a,b) => a-b);
  let max=1, cur=1, curStart=days[0], maxStart=days[0], maxEnd=days[0];
  for (let i=1; i<days.length; i++) {
    const diff = Math.round((days[i]-days[i-1]) / 86400000);
    if (diff === 1) {
      cur++;
      if (cur>max) { max=cur; maxStart=curStart; maxEnd=days[i]; }
    } else {
      cur=1; curStart=days[i];
    }
  }
  return {length:max, startDate:dayKeyOf(maxStart), endDate:dayKeyOf(maxEnd)};
}

// Max beers by one person within any rolling 24h window (not calendar day) —
// sliding window over sorted timestamps, so a late night + early morning
// session isn't artificially split across two calendar days.
// Weekday × hour-of-day counts (Mon=0 … Sun=6, hours 0–23, local time of the export).
// "all" = every counted post; "last8w" = the 8 complete Mon–Sun weeks ending on windowEndKey
// (a Sunday), so the recent picture isn't distorted by a half-finished week.
function calcHeatmap(postTimestamps, windowEndKey) {
  const mk = () => Array.from({length:7}, () => Array(24).fill(0));
  const all = mk(), l8 = mk();
  let total = 0, t8 = 0, lo = null, hi = null;
  if (windowEndKey) {
    hi = keyToLocalDate(windowEndKey); hi.setHours(23, 59, 59, 999);
    lo = keyToLocalDate(windowEndKey); lo.setDate(lo.getDate() - 55);   // Monday, 8 weeks back
  }
  Object.values(postTimestamps || {}).forEach(arr => arr.forEach(ms => {
    const d = new Date(ms), di = (d.getDay() + 6) % 7, h = d.getHours();
    all[di][h]++; total++;
    if (lo && ms >= lo.getTime() && ms <= hi.getTime()) { l8[di][h]++; t8++; }
  }));
  return {
    all: { counts: all, total },
    last8w: lo ? { counts: l8, total: t8, from: dayKeyOf(lo), to: windowEndKey } : null
  };
}
function calcMax24hAll(postTimestamps) {
  const DAY_MS = 86400000;
  let best = {name:null, count:0, windowStart:null, windowEnd:null};
  Object.entries(postTimestamps).forEach(([name, times]) => {
    const sorted = [...times].sort((a,b)=>a-b);
    let left = 0;
    for (let right=0; right<sorted.length; right++) {
      while (sorted[right]-sorted[left] > DAY_MS) left++;
      const count = right-left+1;
      if (count > best.count) {
        best = {name, count, windowStart:sorted[left], windowEnd:sorted[right]};
      }
    }
  });
  return best;
}

// Top N calendar days ever, group-wide — reuses history.daily, no new parsing needed.
function calcBestDays(dailyObj, topN=3) {
  return Object.entries(dailyObj||{})
    .sort((a,b)=>b[1]-a[1])
    .slice(0,topN)
    .map(([date,count])=>({date,count}));
}

// Per-member ranking over an inclusive date range (YYYY-MM-DD keys) — same
// idea as calcDayContributors but for a whole week bucket instead of one day.
// "YYYY-MM-DD" -> local midnight. Never use new Date('YYYY-MM-DD') for day keys:
// that is UTC midnight, which in Germany is 01:00/02:00 local — post timestamps are local,
// so the whole first day of any window used to be silently cut off.
function keyToLocalDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}
// Whole calendar days between two local dates, immune to DST (23h/25h days).
function dayDiffLocal(a, b) {
  return Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) -
                     Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 86400000);
}
function calcRangeTop(postEvents, startKey, endKey, topN=null) {
  // inclusive range of whole local days
  const start = keyToLocalDate(startKey);
  const end = keyToLocalDate(endKey); end.setHours(23, 59, 59, 999);
  const counts = {};
  (postEvents||[]).forEach(ev => {
    if (ev.date >= start && ev.date <= end) counts[ev.name] = (counts[ev.name]||0) + 1;
  });
  const ranked = Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([name,count])=>({name,count}));
  return topN ? ranked.slice(0,topN) : ranked;
}

// Per-member breakdown of who posted how much on one specific calendar day —
// used to make the "Best day ever" Hall-of-Fame card expandable.
function calcDayContributors(postEvents, dateKey) {
  const counts = {};
  (postEvents||[]).forEach(ev => {
    if (dayKeyOf(ev.date) === dateKey) counts[ev.name] = (counts[ev.name]||0) + 1;
  });
  return Object.entries(counts)
    .sort((a,b)=>b[1]-a[1])
    .map(([name,count])=>({name,count}));
}

// Each member's single best Monday–Sunday week ever, using the same
// week boundaries as the "Beers over time" chart (buildHistory's weekAnchor)
// so this stays consistent with what the chart bars show. Returns the topN
// members ranked by their personal-best week.
function calcBestWeeksPerMember(postEvents, weekAnchorKey, topN=3) {
  const anchor = keyToLocalDate(weekAnchorKey);
  const perMemberWeeks = {}; // name -> { weekStartKey -> count }
  (postEvents||[]).forEach(ev => {
    const idx = Math.floor(dayDiffLocal(ev.date, anchor) / 7); // calendar days, not ms: DST-safe
    const ws = new Date(anchor); ws.setDate(ws.getDate() + idx*7);
    const wsKey = dayKeyOf(ws);
    if (!perMemberWeeks[ev.name]) perMemberWeeks[ev.name] = {};
    perMemberWeeks[ev.name][wsKey] = (perMemberWeeks[ev.name][wsKey]||0) + 1;
  });
  const best = Object.entries(perMemberWeeks).map(([name, weeks]) => {
    const [wsKey, count] = Object.entries(weeks).sort((a,b)=>b[1]-a[1])[0];
    const weStart = keyToLocalDate(wsKey);
    const weEnd = new Date(weStart); weEnd.setDate(weEnd.getDate()+6);
    return { name, count, weekStart: wsKey, weekEnd: dayKeyOf(weEnd) };
  });
  return best.sort((a,b)=>b.count-a.count).slice(0,topN);
}

// All-time rank (by total counter posts) as it stood at the END of a given day
// (inclusive, YYYY-MM-DD key). Used for the rank arrows on the leaderboard.
// Competition ranking: members with the same post count share a rank, so ties
// at the bottom of the table can't produce fake "▲37" movements from tie-break noise.
// Members with 0 posts at that point in time get no rank (undefined).
function calcRankSnapshot(postEvents, cutoffKey) {
  const [y, mo, d] = cutoffKey.split('-').map(Number);
  const cutoff = new Date(y, mo-1, d); // local midnight — same convention as ev.date
  const counts = {};
  (postEvents||[]).forEach(ev => {
    if (ev.date <= cutoff) counts[ev.name] = (counts[ev.name]||0) + 1;
  });
  const rankByCount = {};
  Object.values(counts).sort((a,b)=>b-a).forEach((c,i) => {
    if (!(c in rankByCount)) rankByCount[c] = i+1;
  });
  const ranks = {};
  Object.entries(counts).forEach(([name,c]) => { ranks[name] = rankByCount[c]; });
  return ranks;
}

// Current streak: consecutive days ending at globalMaxDate (the most recent day
// with ANY activity in the group). If the member hasn't posted yet on globalMaxDate
// (e.g. it's still early in the day), count from the day before instead of showing 0 —
// the streak up to yesterday still counts.
function calcCurrentStreak(dayArr, globalMaxDate) {
  if (!dayArr || dayArr.length === 0 || !globalMaxDate) return 0;
  const daySet = new Set(dayArr);
  let cursor = new Date(globalMaxDate);
  if (!daySet.has(dayKeyOf(cursor))) {
    cursor.setDate(cursor.getDate() - 1);
  }
  let count = 0;
  while (daySet.has(dayKeyOf(cursor))) {
    count++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return count;
}

// ---------- WORLD: countries unlocked (from phone numbers in join/leave events) ----------
// Beer posts never carry a phone number in the export (only names), so we can NOT say where
// beers were drunk. What we can say: which country codes have ever been in the group, and when
// the first one showed up. Tables generated from Google's libphonenumber (2026-11-03).

const PHONE_RE = /\+\d[\d\s  ‑()\-]{5,18}\d/g;
function phoneToIso(raw) {
  const d = raw.replace(/\D/g, '');
  if (d[0] === '1') return NANP_MAP[d.slice(1, 4)] || 'US';
  if (d[0] === '7') return KZ_MAP[d.slice(1, 4)] || 'RU';
  for (const L of [3, 2, 1]) { const c = CC_MAP[d.slice(0, L)]; if (c) return c; }
  return null;
}
function isMembershipEvent(cont) {
  // "X hat angefragt, +49… hinzuzufügen": most members get in this way, but WhatsApp never logs
  // whether the request was approved. Without these, half of all countries would be missing.
  if (cont.includes('angefragt')) return WORLD_INCLUDE_INVITES && cont.includes('hinzuzufügen');
  return cont.includes('hinzugefügt') || cont.includes('beigetreten') ||
         cont.includes('hat die Gruppe verlassen') ||
         (cont.includes('entfernt') && (cont.includes('Du hast') || cont.includes(' hat ')));
}
function buildCountries(firstSeenByNumber, groupCreated) {
  const by = {};
  if (HOME_COUNTRY && groupCreated) by[HOME_COUNTRY] = { iso: HOME_COUNTRY, first: groupCreated, numbers: 0 };
  Object.entries(firstSeenByNumber).forEach(([num, d]) => {
    const iso = phoneToIso(num);
    if (!iso) return;
    if (!by[iso]) by[iso] = { iso, first: d, numbers: 0 };
    by[iso].numbers++;
    if (d < by[iso].first) by[iso].first = d;
  });
  return Object.values(by).map(c => ({
    iso: c.iso,
    name: (ISO_INFO[c.iso] || [c.iso])[0],
    num: (ISO_INFO[c.iso] || [null, ''])[1],
    first: dayKeyOf(c.first),
    numbers: c.numbers
  })).sort((a, b) => a.first < b.first ? -1 : a.first > b.first ? 1 : a.name.localeCompare(b.name));
}

// ---------- PROFILES ----------
// URL-safe, readable id for profile links (#/p/<slug>). Earlier first post keeps the plain slug,
// so links stay stable when someone with the same name joins later.
function slugify(name) {
  const s = name.replace(/[‎‏‪-  ~]/g, ' ')
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return s || 'member';
}
// Max own beers in any rolling 24h window, per member (same rule as the Hall of Fame value).
function max24hOf(times) {
  const s = [...times].sort((a, b) => a - b);
  let best = { count: 0, start: null, end: null }, left = 0;
  for (let right = 0; right < s.length; right++) {
    while (s[right] - s[left] > 86400000) left++;
    if (right - left + 1 > best.count) best = { count: right - left + 1, start: s[left], end: s[right] };
  }
  return best;
}
// Best Mon–Sun week per member (own beers only, same buckets as calcBestWeeksPerMember).
function bestWeekByMember(ownEvents, weekAnchorKey) {
  const anchor = keyToLocalDate(weekAnchorKey), per = {};
  ownEvents.forEach(ev => {
    const idx = Math.floor(dayDiffLocal(ev.date, anchor) / 7);
    const ws = new Date(anchor); ws.setDate(ws.getDate() + idx * 7);
    const k = dayKeyOf(ws);
    (per[ev.name] = per[ev.name] || {})[k] = (per[ev.name][k] || 0) + 1;
  });
  const out = {};
  Object.entries(per).forEach(([name, weeks]) => {
    let bk = null, bc = 0;
    Object.entries(weeks).forEach(([k, c]) => { if (c > bc || (c === bc && k < bk)) { bk = k; bc = c; } });
    out[name] = [bc, bk];
  });
  return out;
}
// 👑 / ⚡ history: for every COMPLETE Mon–Sun week, who was #1 and who was Top 5
// (own beers only, excl. i.A.; ties share the place — same rule as the leaderboard icons).
function weeklyHonours(postEvents, weekAnchorKey, endDateKey) {
  const anchor = keyToLocalDate(weekAnchorKey);
  const lcd = keyToLocalDate(endDateKey); lcd.setDate(lcd.getDate() - 1);
  const lastComplete = dayKeyOf(lcd);
  const weeks = {};
  postEvents.forEach(ev => {
    const idx = Math.floor(dayDiffLocal(ev.date, anchor) / 7);
    const ws = new Date(anchor); ws.setDate(ws.getDate() + idx * 7);
    const we = new Date(ws); we.setDate(we.getDate() + 6);
    if (dayKeyOf(we) > lastComplete) return;
    const k = dayKeyOf(ws);
    (weeks[k] = weeks[k] || {})[ev.name] = (weeks[k][ev.name] || 0) + 1;
  });
  const crowns = {}, top5 = {};
  Object.values(weeks).forEach(w => {
    const vals = Object.values(w);
    Object.entries(w).forEach(([name, c]) => {
      const rank = 1 + vals.filter(v => v > c).length;
      if (rank === 1) crowns[name] = (crowns[name] || 0) + 1;
      if (rank <= 5) top5[name] = (top5[name] || 0) + 1;
    });
  });
  return { crowns, top5 };
}
function buildProfiles(parsed, history) {
  const ex = parsed.extra;
  const optout = new Set(PROFILE_OPTOUT);
  const bw = bestWeekByMember(parsed.postEvents.filter(e => !e.ia), history.weekAnchor);
  const hon = weeklyHonours(parsed.postEvents.filter(e => !e.ia), history.weekAnchor, history.endDate);
  const recentFrom = (() => { const d = keyToLocalDate(history.endDate); d.setDate(d.getDate() - 27); return dayKeyOf(d); })();
  const chSet = new Set(CHALLENGE_DAYS.map(c => c.date));
  // slugs: earliest first post keeps the plain slug
  const order = [...parsed.members].sort((a, b) =>
    (ex.firstKey[a.name] || '') < (ex.firstKey[b.name] || '') ? -1 :
    (ex.firstKey[a.name] || '') > (ex.firstKey[b.name] || '') ? 1 : a.name.localeCompare(b.name));
  const used = new Set(), out = {};
  order.forEach(m => {
    if (optout.has(m.name)) return;
    let base = slugify(m.name), s = base, i = 2;
    while (used.has(s)) s = base + '-' + (i++);
    used.add(s);
    const p = { s };
    p.f = ex.firstKey[m.name] || null;
    p.mo = ex.monthly[m.name] || {};
    const h = ex.hourOwn[m.name]; if (h) p.h = h;
    const w = ex.wdOwn[m.name]; if (w) p.w = w;
    const r = {};
    Object.entries(ex.daily[m.name] || {}).forEach(([k, c]) => { if (k >= recentFrom) r[k] = c; });
    if (Object.keys(r).length) p.r = r;
    if (bw[m.name]) p.bw = bw[m.name];
    const t = max24hOf(parsed.ownTimestamps[m.name] || []);
    if (t.count) p.x = [t.count, new Date(t.start).toISOString(), new Date(t.end).toISOString()];
    if (hon.crowns[m.name]) p.c = hon.crowns[m.name];
    if (hon.top5[m.name]) p.t = hon.top5[m.name];
    const ch = Object.keys(ex.daily[m.name] || {}).filter(k => chSet.has(k)).sort();
    if (ch.length) p.ch = ch;
    out[m.name] = p;
  });
  return {
    updated: parsed.updated,
    endDate: history.endDate,
    challengeDays: CHALLENGE_DAYS.map(c => ({ ...c, count: (history.daily || {})[c.date] || 0 })),
    members: out
  };
}

// ---------- members.json builder (unchanged logic) ----------
function parseExport(text) {
  const lines = text.split('\n');
  const CIDX = getCounterIndex(text);
  const posts={}, iaCount={}, lastD={}, firstD={}, joinD={}, dailyPosts={}, dailyOwn={}, postTimestamps={}, ownTimestamps={};
  const lastEvent={};
  const postEvents=[]; // {name, date} for every valid counter post — used for weekly top3
  let groupCreated = null;
  // profile extras (new, read-only additions — nothing above changes because of them)
  const numFirst={}, monthly={}, hourOwn={}, wdOwn={}, dailyCnt={}, firstKey={};

  for (let li=0; li<lines.length; li++) {
    const raw = lines[li];
    const line = clean(raw);
    const m = MSG_RE.exec(line);
    if (!m) continue;
    const [, dateStr, timeStr, sender, rawContent] = m;
    const snd=sender.trim(), cont=clean(rawContent), d=parseDate(dateStr);
    if (!d) continue;

    // World map: phone numbers only appear in join/leave/remove events
    if (isMembershipEvent(cont)) {
      ((snd + ' ' + cont).match(PHONE_RE) || []).forEach(n => {
        const key = '+' + n.replace(/\D/g, '');
        if (!numFirst[key] || d < numFirst[key]) numFirst[key] = d;
      });
    }

    if (cont.includes('erstellt') && !groupCreated) { groupCreated=d; continue; }

    if (cont.includes('hinzugefügt') || cont.includes('beigetreten')) {
      const jm=JOIN_RE.exec(cont);
      if (jm) {
        const added=jm[1].trim();
        if (!joinD[added]) joinD[added]=d;
        lastEvent[added]='join';
      }
      if (cont.includes('beigetreten')) {
        if (!joinD[snd]) joinD[snd]=d;
        lastEvent[snd]='join';
      }
      continue;
    }

    if (cont.includes('hat die Gruppe verlassen')) { lastEvent[snd]='leave'; continue; }

    if (cont.includes('entfernt') && (cont.includes('Du hast') || cont.includes(' hat '))) {
      lastEvent[snd]='leave'; continue;
    }

    const isBeer = IMG_RE.test(cont);
    if (!isBeer && SKIP.some(w=>cont.includes(w))) continue;

    if (isBeer) {
      posts[snd]=(posts[snd]||0)+1;
      const isIA = looksIA(cont);
      if (isIA) iaCount[snd]=(iaCount[snd]||0)+1;
      if (!lastD[snd]||d>lastD[snd]) lastD[snd]=d;
      if (!firstD[snd]||d<firstD[snd]) firstD[snd]=d;
      const dk = dayKeyOf(d);
      if (!dailyPosts[snd]) dailyPosts[snd]=[];
      if (dailyPosts[snd].indexOf(dk)===-1) dailyPosts[snd].push(dk);
      if (!isIA) {
        if (!dailyOwn[snd]) dailyOwn[snd]=[];
        if (dailyOwn[snd].indexOf(dk)===-1) dailyOwn[snd].push(dk);
      }
      lastEvent[snd]='post';
      postEvents.push({name:snd, date:d, ia:isIA});
      const mk = dk.slice(0,7);
      (monthly[snd] = monthly[snd] || {})[mk] = (monthly[snd][mk]||0) + 1;
      (dailyCnt[snd] = dailyCnt[snd] || {})[dk] = (dailyCnt[snd][dk]||0) + 1;
      if (!firstKey[snd] || dk < firstKey[snd]) firstKey[snd] = dk;
      const dt = parseDateTime(dateStr, timeStr);
      if (dt) {
        if (!postTimestamps[snd]) postTimestamps[snd]=[];
        postTimestamps[snd].push(dt.getTime());
        if (!isIA) {
          if (!ownTimestamps[snd]) ownTimestamps[snd]=[]; ownTimestamps[snd].push(dt.getTime());
          (hourOwn[snd] = hourOwn[snd] || Array(24).fill(0))[dt.getHours()]++;
          (wdOwn[snd] = wdOwn[snd] || Array(7).fill(0))[(dt.getDay()+6)%7]++;   // Mon=0
        }
      }
    }
  }

  const now=new Date();
  const fallback=groupCreated||new Date(2025,11,30);

  let globalMaxDate=null;
  Object.values(lastD).forEach(d=>{ if(!globalMaxDate||d>globalMaxDate) globalMaxDate=d; });

  const result=Object.entries(posts).map(([name,count])=>{
    const last=lastD[name];
    const join=joinD[name]||fallback;
    const memDays=Math.max(1,dayDiffLocal(now,join));   // calendar days, DST-safe
    const daysAgo=Math.max(0,dayDiffLocal(now,last));
    const ppw=Math.round(count/(memDays/7)*10)/10;
    const streakObj=calcStreak(dailyOwn[name]||[]);
    const currentStreak=calcCurrentStreak(dailyOwn[name]||[], globalMaxDate);
    const hasLeft = lastEvent[name]==='leave';
    return {name,posts:count,iaPosts:iaCount[name]||0,daysAgo,ppw,memDays,streak:streakObj.length,
            streakStart:streakObj.startDate,streakEnd:streakObj.endDate,
            currentStreak,hasLeft,
            joinStr:fmt(join),lastStr:fmt(last),
            // calendar keys so the dashboard can recompute days/week-rates live at view time
            // (daysAgo/ppw above are only a snapshot from the moment of upload)
            lastKey:dayKeyOf(last),joinKey:dayKeyOf(join)};
  }).sort((a,b)=>b.posts-a.posts);

  const postsAccepted=result.reduce((s,m)=>s+m.posts,0);
  const totalPosts=postsAccepted;   // headline = number of photos (beers); the chat counter is kept separately
  const counter=CIDX.counter||null;
  const updated=now.toLocaleDateString('de-DE',{
    day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  return {members:result,totalPosts,postsAccepted,counter,counterInfo:CIDX,updated,groupCreated:groupCreated||fallback,postTimestamps,ownTimestamps,postEvents,
          extra:{numFirst, monthly, hourOwn, wdOwn, daily:dailyCnt, firstKey}};
}

// ---------- history.json builder (full re-derivation from export each time) ----------
function buildHistory(text, groupCreatedFallback) {
  const lines = text.split('\n');
  const CIDX = getCounterIndex(text);
  const dailyPosts = {}; // dayKey -> count
  let groupCreated = null;

  for (let li=0; li<lines.length; li++) {
    const raw = lines[li];
    const line = clean(raw);
    const m = MSG_RE.exec(line);
    if (!m) continue;
    const [, dateStr, timeStr, sender, rawContent] = m;
    const cont=clean(rawContent), d=parseDate(dateStr);
    if (!d) continue;

    if (cont.includes('erstellt') && !groupCreated) { groupCreated=d; continue; }
    if (cont.includes('hinzugefügt') || cont.includes('beigetreten')) continue;
    if (cont.includes('hat die Gruppe verlassen')) continue;
    if (cont.includes('entfernt') && (cont.includes('Du hast') || cont.includes(' hat '))) continue;
    const isBeer = IMG_RE.test(cont);
    if (!isBeer && SKIP.some(w=>cont.includes(w))) continue;

    if (isBeer) {
      const dk = dayKeyOf(d);
      dailyPosts[dk] = (dailyPosts[dk]||0) + 1;
    }
  }

  const start = groupCreated || groupCreatedFallback || new Date(2025,11,30);
  const dayKeys = Object.keys(dailyPosts);
  let end = start;
  dayKeys.forEach(k => { const d=keyToLocalDate(k); if (d>end) end=d; });
  if (dayKeys.length===0) end = start;

  // Weekly buckets always start on Monday 00:00, regardless of which weekday
  // the group happened to be founded on — otherwise buckets run e.g. Tue–Mon
  // and the "current" bar can show almost no data for most of the week.
  const weekAnchor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  weekAnchor.setDate(weekAnchor.getDate() - ((weekAnchor.getDay()+6)%7));

  // Build weekly buckets from the Monday on/before start, through end
  const weekly = [];
  let cursor = new Date(weekAnchor);
  let running = 0;
  while (cursor <= end) {
    const weekEnd = new Date(cursor); weekEnd.setDate(weekEnd.getDate()+6);
    let weekTotal = 0;
    let d2 = new Date(cursor);
    while (d2 <= weekEnd && d2 <= end) {
      weekTotal += dailyPosts[dayKeyOf(d2)] || 0;
      d2.setDate(d2.getDate()+1);
    }
    running += weekTotal;
    weekly.push({ weekStart: dayKeyOf(cursor), posts: weekTotal, cumulative: running });
    cursor = new Date(weekEnd); cursor.setDate(cursor.getDate()+1);
  }

  return {
    startDate: dayKeyOf(start),
    endDate: dayKeyOf(end),
    weekAnchor: dayKeyOf(weekAnchor),
    totalPosts: running,
    weekly,
    daily: dailyPosts
  };
}

let token='',repo='',fileContent=null;
function setMsg(id,t,type){const el=document.getElementById(id);el.textContent=t;el.className='msg '+type;}
function setStep(t){document.getElementById('step-text').textContent=t;}
function setProgress(p){document.getElementById('progress').style.display='block';document.getElementById('pbar').style.width=p+'%';}

async function doLogin(){
  const pw=document.getElementById('pw').value.trim();
  const rv=document.getElementById('repo').value.trim();
  if(!pw||!rv){setMsg('login-msg','Please enter token and repo.','err');return;}
  setStep('Checking connection…');
  try{
    const res=await fetch(`https://api.github.com/repos/${rv}`,
      {headers:{Authorization:'token '+pw,'User-Agent':'OMG-Admin'}});
    if(!res.ok) throw new Error('Invalid token or repo.');
    token=pw; repo=rv;
    document.getElementById('login-section').style.display='none';
    document.getElementById('upload-section').style.display='block';
    setStep('Connected ✓  —  now select your export file.');
  }catch(e){setMsg('login-msg',e.message,'err');setStep('');}
}

function handleFile(file){
  const r=new FileReader();
  r.onload=e=>{
    fileContent=e.target.result;
    document.getElementById('drop-zone').querySelector('.drop-title').textContent='✓ '+file.name;
    document.getElementById('upload-btn').disabled=false;
    setStep('File ready — click "Process & upload".');
  };
  r.readAsText(file,'UTF-8');
}
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');
  if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);});
document.getElementById('file-input').addEventListener('change',
  e=>{if(e.target.files[0])handleFile(e.target.files[0]);});

async function putFile(path, jsonObj, commitMsg, compact) {
  const apiUrl=`https://api.github.com/repos/${repo}/contents/${path}`;
  const b64=btoa(unescape(encodeURIComponent(compact ? JSON.stringify(jsonObj) : JSON.stringify(jsonObj,null,2))));
  let sha=null;
  const ex=await fetch(apiUrl,{headers:{Authorization:'token '+token}});
  if(ex.ok) sha=(await ex.json()).sha;
  const put=await fetch(apiUrl,{
    method:'PUT',
    headers:{Authorization:'token '+token,'Content-Type':'application/json'},
    body:JSON.stringify({message:commitMsg,content:b64,...(sha?{sha}:{})})
  });
  if(!put.ok) throw new Error((await put.json()).message||`GitHub API error on ${path}`);
}

// Everything that is computed from the export, without touching GitHub.
// (Pure function, so it can also be tested offline.)
function buildAll(text){
  const parsed=parseExport(text);
  if(!parsed.members.length) throw new Error('No posts found in file.');
  const history=buildHistory(text, parsed.groupCreated);

  // Week-over-week comparison: the last *complete* Monday–Sunday bucket vs the
  // one before it — same bucket boundaries as the chart and the best-week
  // record, so "this week" never means something different depending on
  // which part of the dashboard you're looking at. The most recent bucket is
  // skipped if it isn't fully elapsed yet (still being posted into).
  let weeklyComparison = null, weeklyTop3 = [];
  if (history.weekly.length) {
    const lcd = keyToLocalDate(history.endDate); lcd.setDate(lcd.getDate()-1);
    const lastCompleteKey = dayKeyOf(lcd);   // calendar-day keys: new Date('YYYY-MM-DD') is UTC and broke on DST-switch weeks
    let thisWeekIdx = -1;
    history.weekly.forEach((w,i) => {
      const we = keyToLocalDate(w.weekStart); we.setDate(we.getDate()+6);
      if (dayKeyOf(we) <= lastCompleteKey) thisWeekIdx = i;
    });
    if (thisWeekIdx >= 0) {
      const thisWeek = history.weekly[thisWeekIdx];
      const prevWeek = thisWeekIdx > 0 ? history.weekly[thisWeekIdx-1] : null;
      const weekEnd = keyToLocalDate(thisWeek.weekStart); weekEnd.setDate(weekEnd.getDate()+6);
      const prevWeekEnd = prevWeek ? (() => { const d=keyToLocalDate(prevWeek.weekStart); d.setDate(d.getDate()+6); return d; })() : null;
      weeklyComparison = {
        windowStart: thisWeek.weekStart,
        windowEnd: dayKeyOf(weekEnd),
        prevWindowStart: prevWeek ? prevWeek.weekStart : null,
        prevWindowEnd: prevWeekEnd ? dayKeyOf(prevWeekEnd) : null,
        total: thisWeek.posts,
        prevTotal: prevWeek ? prevWeek.posts : 0
      };
      // Crown / Top 5 / weekly top 3 = own beers only (i.A. posts excluded); group totals and all-time ranking still count them
      const ownEvents = parsed.postEvents.filter(e=>!e.ia);
      weeklyTop3 = calcRangeTop(ownEvents, thisWeek.weekStart, weeklyComparison.windowEnd, 3);
      const last7Counts = {};
      calcRangeTop(ownEvents, thisWeek.weekStart, weeklyComparison.windowEnd)
        .forEach(r => { last7Counts[r.name] = r.count; });
      parsed.members.forEach(m => { m.last7 = last7Counts[m.name] || 0; });

      // Rank arrows: all-time rank at the end of the last complete week vs. the
      // end of the week before — same Mon–Sun boundaries as everything else.
      // rankPrev stays null when there is no earlier week (or the member had no
      // posts yet back then), in which case the dashboard shows no arrow.
      const rankNow = calcRankSnapshot(parsed.postEvents, weeklyComparison.windowEnd);
      const rankBefore = weeklyComparison.prevWindowEnd
        ? calcRankSnapshot(parsed.postEvents, weeklyComparison.prevWindowEnd) : null;
      parsed.members.forEach(m => {
        m.rankCurr = rankNow[m.name] || null;
        m.rankPrev = rankBefore ? (rankBefore[m.name] || null) : null;
      });
    }
  }

  const bestDaysTop3 = calcBestDays(history.daily, 3);
  const bestDayEver = bestDaysTop3[0]
    ? {...bestDaysTop3[0], contributors: calcDayContributors(parsed.postEvents, bestDaysTop3[0].date)}
    : null;
  const topStreaksEver = [...parsed.members]
    .filter(m=>m.streak>0)
    .sort((a,b)=>b.streak-a.streak)
    .slice(0,3)
    .map(m=>({name:m.name, streak:m.streak, startDate:m.streakStart, endDate:m.streakEnd}));
  const max24h = calcMax24hAll(parsed.ownTimestamps||{});
  const bestWeeksEver = calcBestWeeksPerMember(parsed.postEvents.filter(e=>!e.ia), history.weekAnchor, 3);
  const records = {
    updated: parsed.updated,
    bestDayEver,
    bestDaysTop3,
    topStreaksEver,
    bestWeeksEver,
    weeklyComparison,
    heatmap: calcHeatmap(parsed.postTimestamps, weeklyComparison && weeklyComparison.windowEnd),
    mostBeers24h: max24h.count>0 ? {
      name: max24h.name,
      count: max24h.count,
      windowStart: new Date(max24h.windowStart).toISOString(),
      windowEnd: new Date(max24h.windowEnd).toISOString()
    } : null,
    // NEW: countries unlocked (country codes of numbers that joined/left the group)
    countries: buildCountries(parsed.extra.numFirst, parsed.groupCreated)
  };
  const profiles = buildProfiles(parsed, history);
  const membersJson = {members:parsed.members, totalPosts:parsed.totalPosts, postsAccepted:parsed.postsAccepted, counter:parsed.counter, updated:parsed.updated};
  return {parsed, history, weeklyComparison, weeklyTop3, records, profiles, membersJson};
}

async function doUpload(){
  if(!fileContent)return;
  document.getElementById('upload-btn').disabled=true;
  setProgress(10); setStep('Parsing export…');
  let B;
  try{
    B=buildAll(fileContent);
  }catch(e){
    setMsg('upload-msg','Parse error: '+e.message,'err');
    document.getElementById('upload-btn').disabled=false; return;
  }
  const {parsed, history, weeklyComparison, weeklyTop3, records, profiles, membersJson} = B;

  const leftCount=parsed.members.filter(m=>m.hasLeft).length;
  setProgress(30);
  setStep(`${parsed.members.length} members · ${leftCount} have left. Uploading leaderboard…`);

  try{
    await putFile('data/members.json', membersJson, `Update leaderboard – ${parsed.updated}`);

    setProgress(50);
    setStep('Uploading history…');
    await putFile('data/history.json', history, `Update history – ${parsed.updated}`);

    setProgress(70);
    setStep('Uploading hall-of-fame records + countries…');
    await putFile('data/records.json', records, `Update records – ${parsed.updated}`);

    setProgress(85);
    setStep('Uploading member profiles…');
    await putFile('data/profiles.json', profiles, `Update profiles – ${parsed.updated}`, true);

    setProgress(100);
    setMsg('upload-msg',
      `✅ Done! ${parsed.members.length} members (${leftCount} left), ${parsed.totalPosts.toLocaleString('en')} photos counted as beers, ${Object.keys(profiles.members).length} profiles, ${records.countries.length} countries unlocked. History updated through ${history.endDate}. Live in ~30s.`,
      'ok');
    showRecap(parsed, history, weeklyComparison, weeklyTop3);
    setStep('');
    document.getElementById('upload-btn').disabled=false;
  }catch(e){
    setMsg('upload-msg','❌ Upload failed: '+e.message,'err');
    document.getElementById('upload-btn').disabled=false; setStep('');
  }
}

function showRecap(parsed, history, weeklyComparison, weeklyTop3){
  const top3=weeklyTop3||[];
  const medals=['🥇','🥈','🥉'];
  const top3Lines = top3.length
    ? top3.map((m,i)=>`${medals[i]} ${m.name} – ${m.count} beers this week`).join('\n')
    : 'No data available';

  const daysSinceStart = Math.max(1, dayDiffLocal(keyToLocalDate(history.endDate), keyToLocalDate(history.startDate)) + 1);
  const dailyAvg = (parsed.totalPosts / daysSinceStart).toFixed(1);

  // Week-over-week comparison line. No prior complete week to compare against
  // (e.g. very early in the group's life) → just show the total without a delta.
  const weeklyTotal = weeklyComparison ? weeklyComparison.total : 0;
  const prevWeekTotal = weeklyComparison ? weeklyComparison.prevTotal : 0;
  let weekCompareLine = `📦 This week: ${weeklyTotal.toLocaleString('en')} beers`;
  if (prevWeekTotal > 0) {
    const diff = weeklyTotal - prevWeekTotal;
    const pct = (diff / prevWeekTotal * 100);
    const sign = diff >= 0 ? '+' : '';
    weekCompareLine += ` (${sign}${diff.toLocaleString('en')} / ${sign}${pct.toFixed(1)}% vs. last week)`;
  }

  const text =
`📊 WEEKLY UPDATE

🍺 Beers counted: ${parsed.totalPosts.toLocaleString('en')}
⚠️ *NEXT NUMBER TO POST: ${(parsed.totalPosts+1).toLocaleString('en')}* ⚠️
📈 Daily average: ${dailyAvg} beers/day (all-time)
${weekCompareLine}

🏆 Top 3 this week:
${top3Lines}

Full leaderboard: onemillionbeer.de
📸 Instagram: https://instagram.com/one.millionbeers`;

  document.getElementById('recap-text').value = text;
  document.getElementById('recap-box').style.display = 'block';
}

function copyRecap(){
  const ta=document.getElementById('recap-text');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).catch(()=>{ ta.select(); document.execCommand('copy'); });
  } else {
    ta.select(); document.execCommand('copy');
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
